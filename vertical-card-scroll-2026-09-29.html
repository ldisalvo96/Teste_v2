const existingOverlay = document.querySelector('.text-overlay');
if (existingOverlay) {
  existingOverlay.remove();

// Generative card stack with 8 separate content slots and native canvas text rendering.
let globalTime = 0;
let lastTimestamp = 0;
let hoveredIndex = -1;
let targetGlobalTime = 0;
let isHovering = false;
const imageCache = new Map();

// Smooth per-card hover scale
const cardScales = new Map();
const HOVER_SCALE = 1.08;
const SCALE_EASE = 0.18;

// Text alpha transition
let textAlpha = 0;
let lastHoveredSlot = null;

// Font handling
let customFontLoaded = false;

async function loadCustomFont(url) {
  if (typeof url === 'string' && url.trim() !== '') {
    try {
      const fontName = 'CustomUserFont';
      const fontFace = new FontFace(fontName, `url(${url})`);
      const loadedFace = await fontFace.load();
      document.fonts.add(loadedFace);
      customFontLoaded = true;
    } catch (err) {
      console.warn('Custom font load failed, falling back to system font.', err);
      customFontLoaded = false;
    }
  } else {
    customFontLoaded = false;
  }
}

controls.onChange('customFont', loadCustomFont);
loadCustomFont(controls.get('customFont'));

// Easing functions
const easeFunctions = {
  'Linear': (p) => p,
  'Quad-InOut': (p) => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2,
  'Cubic-InOut': (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  'Back-Out': (p) => {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
  },
  'Expo-InOut': (p) => p === 0 ? 0 : p === 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2
};

function getCachedImage(url) {
  if (!url) return null;
  if (imageCache.has(url)) return imageCache.get(url);
  const img = new Image();
  img.src = url;
  img.crossOrigin = 'anonymous';
  imageCache.set(url, img);
  return img;
}

function getActiveSlots() {
  const slots = [];
  for (let i = 1; i <= 8; i++) {
    const url = controls.get(`image_${i}`);
    if (url) {
      slots.push({
        id: i,
        url: url,
        headline1: controls.get(`headline_${i}_1`) || '',
        headline2: controls.get(`headline_${i}_2`) || '',
        headline3: controls.get(`headline_${i}_3`) || '',
        description: controls.get(`description_${i}`) || ''
      });
    }
  }
  return slots;
}

// Text wrapping utility
function getWrappedLines(ctx, text, maxWidth) {
  const paragraphs = text.split(/\r?\n|\\n/);
  const allLines = [];
  
  for (const para of paragraphs) {
    const words = para.split(' ');
    let line = '';
    
    for (let n = 0; n < words.length; n++) {
      const testLine = line + (line === '' ? '' : ' ') + words[n];
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        allLines.push(line);
        line = words[n];
      } else {
        line = testLine;
      }
    }
    allLines.push(line);
  }
  return allLines;
}

// Native Canvas Metadata Renderer
function drawMetadata(ctx, slot, alpha) {
  if (alpha <= 0.01) return;

  ctx.save();
  ctx.globalAlpha = alpha;

  const w = canvas.width;
  const h = canvas.height;
  const isLandscape = w >= h;

  const headlineColor = controls.get('headlineColor');
  const descriptionColor = controls.get('descriptionColor');
  const hSize = controls.get('hSize');
  const dSize = controls.get('dSize');
  const textLeftMargin = controls.get('textLeftMargin');

  const fontName = customFontLoaded ? 'CustomUserFont' : 'var(--clay-font)';

  const h1 = slot.headline1 || '';
  const h2 = slot.headline2 || '';
  const h3 = slot.headline3 || '';
  const desc = slot.description || '';

  // No text shadow for clean typography

  if (isLandscape) {
    // Landscape layout: Text on the left side of the screen
    const paddingLeft = textLeftMargin;
    
    // Calculate available width before hitting the centered card stack
    const scale = controls.get('scale');
    const cardW = w * 0.4 * scale;
    const cardLeftEdge = w / 2 - cardW / 2;
    const textWidth = Math.max(200, cardLeftEdge - paddingLeft - 40);
    
    // Calculate total height to center vertically
    let totalHeight = 0;
    if (h1) totalHeight += hSize * 1.1;
    
    ctx.font = `bold ${hSize * 1.8}px ${fontName}`;
    const titleLines = getWrappedLines(ctx, h2, textWidth);
    totalHeight += titleLines.length * hSize * 2.0;
    
    if (h3) totalHeight += hSize * 1.5;
    totalHeight += 20; // Gap
    
    ctx.font = `normal ${dSize}px ${fontName}`;
    const descLines = getWrappedLines(ctx, desc, textWidth);
    totalHeight += descLines.length * dSize * 1.4;

    let currentY = (h - totalHeight) / 2;

    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    // Draw Part 1 (Number/Prefix)
    if (h1) {
      ctx.font = `normal ${hSize * 0.9}px ${fontName}`;
      ctx.fillStyle = descriptionColor;
      ctx.fillText(h1, paddingLeft, currentY);
      currentY += hSize * 1.2;
    }

    // Draw Part 2 (Main Title)
    if (h2) {
      ctx.font = `bold ${hSize * 1.8}px ${fontName}`;
      ctx.fillStyle = headlineColor;
      titleLines.forEach(line => {
        ctx.fillText(line, paddingLeft, currentY);
        currentY += hSize * 2.0;
      });
    }

    // Draw Part 3 (Year/Suffix)
    if (h3) {
      ctx.font = `italic ${hSize * 1.0}px ${fontName}`;
      ctx.fillStyle = descriptionColor;
      ctx.fillText(h3, paddingLeft, currentY);
      currentY += hSize * 1.6;
    }

    currentY += 20; // Gap before description

    // Draw Description
    ctx.font = `normal ${dSize}px ${fontName}`;
    ctx.fillStyle = descriptionColor;
    descLines.forEach(line => {
      ctx.fillText(line, paddingLeft, currentY);
      currentY += dSize * 1.4;
    });

  } else {
    // Portrait layout: Text at the bottom of the screen with a dark gradient scrim
    const paddingX = textLeftMargin;
    const textWidth = Math.max(150, w - paddingX - 40);
    
    // Calculate total height for portrait
    let totalHeight = 0;
    if (h1) totalHeight += hSize * 1.0;
    
    ctx.font = `bold ${hSize * 1.4}px ${fontName}`;
    const titleLines = getWrappedLines(ctx, h2 + (h3 ? ` ${h3}` : ''), textWidth);
    totalHeight += titleLines.length * hSize * 1.6;
    
    totalHeight += 15; // Gap
    
    ctx.font = `normal ${dSize}px ${fontName}`;
    const descLines = getWrappedLines(ctx, desc, textWidth);
    totalHeight += descLines.length * dSize * 1.4;

    // Draw a beautiful dark gradient scrim at the bottom
    const scrimHeight = Math.max(h * 0.32, totalHeight + h * 0.08);
    const gradient = ctx.createLinearGradient(0, h - scrimHeight, 0, h);
    gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
    gradient.addColorStop(0.3, 'rgba(0, 0, 0, 0.8)');
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0.95)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, h - scrimHeight, w, scrimHeight);

    let currentY = h - h * 0.06; // Start from bottom up

    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';

    // Draw description lines from bottom to top
    for (let i = descLines.length - 1; i >= 0; i--) {
      ctx.fillText(descLines[i], paddingX, currentY);
      currentY -= dSize * 1.4;
    }

    currentY -= 15; // Gap

    // Draw Title and Year
    ctx.font = `bold ${hSize * 1.4}px ${fontName}`;
    ctx.fillStyle = headlineColor;
    for (let i = titleLines.length - 1; i >= 0; i--) {
      ctx.fillText(titleLines[i], paddingX, currentY);
      currentY -= hSize * 1.6;
    }

    // Draw Number
    if (h1) {
      ctx.font = `normal ${hSize * 0.8}px ${fontName}`;
      ctx.fillStyle = descriptionColor;
      ctx.fillText(h1, paddingX, currentY);
    }
  }

  ctx.restore();
}

function drawCard(x, y, w, h, img, rotation, hoverScale) {
  const radius = controls.get('borderRadius');
  const borderColor = controls.get('borderColor');
  const s = hoverScale ?? 1;
  const t = (s - 1) / (HOVER_SCALE - 1); // 0..1 hover progress

  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(rotation);

  if (s !== 1) {
    ctx.scale(s, s);
  }

  // Image
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(-w / 2 + 10, -h / 2 + 10, w - 20, h - 20, Math.max(0, radius - 10));
  ctx.clip();
  if (img && img.complete && img.naturalWidth > 0) {
    CanvasRuntimeAPI.drawImage(ctx, img, -w / 2 + 10, -h / 2 + 10, w - 20, h - 20, 'cover');
  } else {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.fillRect(-w / 2 + 10, -h / 2 + 10, w - 20, h - 20);
  }
  ctx.restore();
  
  // Border
  if (controls.get('showBorder')) {
    ctx.beginPath();
    ctx.roundRect(-w / 2, -h / 2, w, h, radius);
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 2 + 2 * t;
    ctx.stroke();
  }
  
  ctx.restore();
}

function getCardAtPosition(pos) {
  const slots = getActiveSlots();
  const w = canvas.width;
  const h = canvas.height;
  const scale = controls.get('scale');
  const cardW = w * 0.4 * scale;
  const defaultRatio = 1.4;
  const gap = controls.get('gap');
  const capacity = controls.get('capacity');
  const easeType = controls.get('easeType');
  const ease = easeFunctions[easeType] || easeFunctions['Cubic-InOut'];

  const hitTestData = slots.map((slot, i) => {
    const img = getCachedImage(slot.url);
    const ratio = (img && img.complete && img.naturalHeight > 0) ? (img.naturalHeight / img.naturalWidth) : defaultRatio;
    const cardH = cardW * ratio;
    const p = (globalTime + i / slots.length) % 1;
    const easedP = ease(p);
    const startY = h + cardH;
    const endY = -cardH;
    const centerY = h / 2;
    let y;
    if (easedP < 0.5) {
      const t = easedP * 2;
      y = startY + (centerY - startY) * t;
    } else {
      const t = (easedP - 0.5) * 2;
      y = centerY + (endY - centerY) * t;
    }
    const stackIndex = i % capacity;
    const stackOffset = (stackIndex - capacity / 2) * gap;
    y += stackOffset;
    return { id: slot.id, x: w / 2 - cardW / 2 - 10, y: y - cardH / 2 - 10, w: cardW + 20, h: cardH + 20, p };
  });

  hitTestData.sort((a, b) => b.p - a.p);

  for (const card of hitTestData) {
    if (pos.x >= card.x && pos.x <= card.x + card.w &&
        pos.y >= card.y && pos.y <= card.y + card.h) {
      return card.id;
    }
  }
  return -1;
}

canvas.addEventListener('mousemove', (e) => {
  const pos = CanvasRuntimeAPI.getMousePos(e);
  const foundIndex = getCardAtPosition(pos);

  if (foundIndex !== -1) {
    canvas.style.cursor = 'pointer';
    if (hoveredIndex !== foundIndex) {
      hoveredIndex = foundIndex;
      isHovering = true;
      
      const slots = getActiveSlots();
      const visualIndex = slots.findIndex(s => s.id === hoveredIndex);
      targetGlobalTime = 0.5 - (visualIndex / slots.length);
      const period = 1;
      const diff = ((targetGlobalTime - globalTime) % period + period + period / 2) % period - period / 2;
      targetGlobalTime = globalTime + diff;
    }
  } else {
    canvas.style.cursor = 'default';
    isHovering = false;
    hoveredIndex = -1;
  }
});

canvas.addEventListener('mouseleave', () => {
  isHovering = false;
  hoveredIndex = -1;
  canvas.style.cursor = 'default';
});

canvas.addEventListener('click', (e) => {
  const pos = CanvasRuntimeAPI.getMousePos(e);
  const clickedIndex = getCardAtPosition(pos);
  if (clickedIndex !== -1) {
    const link = controls.get(`link_${clickedIndex}`);
    if (link && link.trim() !== '') {
      window.open(link, '_blank');
    }
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const sensitivity = 0.0005;
  globalTime += e.deltaY * sensitivity;
  
  isHovering = false;
  hoveredIndex = -1;
}, { passive: false });

function draw(timestamp) {
  if (!lastTimestamp) lastTimestamp = timestamp;
  const deltaTime = Math.min((timestamp - lastTimestamp) * 0.001, 0.1);
  lastTimestamp = timestamp;

  if (isHovering) {
    globalTime += (targetGlobalTime - globalTime) * 0.1;
  } else if (controls.get('playing')) {
    globalTime += deltaTime * controls.get('speed') * 0.2;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const slots = getActiveSlots();
  if (slots.length === 0) {
    requestAnimationFrame(draw);
    return;
  }

  const w = canvas.width;
  const h = canvas.height;
  const scale = controls.get('scale');
  const cardW = w * 0.4 * scale;
  const defaultRatio = 1.4;
  const gap = controls.get('gap');
  const capacity = controls.get('capacity');
  const jitterAmount = controls.get('jitter') * (Math.PI / 180);
  const easeType = controls.get('easeType');
  const ease = easeFunctions[easeType] || easeFunctions['Cubic-InOut'];

  const cardData = slots.map((slot, i) => {
    const img = getCachedImage(slot.url);
    const ratio = (img && img.complete && img.naturalHeight > 0) ? (img.naturalHeight / img.naturalWidth) : defaultRatio;
    const cardH = cardW * ratio;

    const p = (globalTime + i / slots.length) % 1;
    const easedP = ease(p);
    
    const startY = h + cardH;
    const endY = -cardH;
    const centerY = h / 2;
    
    let y;
    if (easedP < 0.5) {
      const t = easedP * 2;
      y = startY + (centerY - startY) * t;
    } else {
      const t = (easedP - 0.5) * 2;
      y = centerY + (endY - centerY) * t;
    }

    const stackIndex = i % capacity;
    const stackOffset = (stackIndex - capacity / 2) * gap;
    y += stackOffset;

    const rotation = Math.sin(i * 1.5) * jitterAmount;

    return { url: slot.url, y, p, rotation, id: slot.id, cardH };
  });

  cardData.sort((a, b) => a.p - b.p);

  // Ease per-card hover scale toward target
  const activeIds = new Set(slots.map(s => s.id));
  activeIds.forEach(id => {
    const current = cardScales.get(id) ?? 1;
    const target = id === hoveredIndex ? HOVER_SCALE : 1;
    const next = current + (target - current) * SCALE_EASE;
    cardScales.set(id, Math.abs(next - target) < 0.0005 ? target : next);
  });

  cardData.forEach(data => {
    const img = getCachedImage(data.url);
    const hoverScale = cardScales.get(data.id) ?? 1;
    drawCard(w / 2 - cardW / 2, data.y - data.cardH / 2, cardW, data.cardH, img, data.rotation, hoverScale);
  });

  // Smoothly transition text alpha and draw metadata
  if (hoveredIndex !== -1) {
    const slot = slots.find(s => s.id === hoveredIndex);
    if (slot) {
      lastHoveredSlot = slot;
    }
  }

  const targetAlpha = (isHovering && hoveredIndex !== -1) ? 1 : 0;
  textAlpha += (targetAlpha - textAlpha) * 0.15;

  if (textAlpha > 0.01 && lastHoveredSlot) {
    drawMetadata(ctx, lastHoveredSlot, textAlpha);
  }

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
